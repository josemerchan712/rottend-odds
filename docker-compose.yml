# Desarrollo local: Postgres + servidor. Los secretos salen de .env (copia .env.example).
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casino
      POSTGRES_USER: ${DB_USER:-casino}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d casino"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/casino
      DB_USER: ${DB_USER:-casino}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (32+ caracteres)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
    ports:
      - "8080:8080"

volumes:
  db-data:
